<style>

:root{

}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.brand{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:grid;gap:2px;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.brand b{font-family:var(--display);font-weight:700;letter-spacing:.32em;font-size:20px}
.brand span{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
.hint{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));font:500 12px var(--mono);letter-spacing:.06em;color:var(--ink);background:var(--glass);border:1px solid var(--line);padding:6px 10px;border-radius:6px;transition:opacity .6s}
.hint.gone{opacity:0}
.dock{position:fixed;left:0;right:0;bottom:0;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:8px;pointer-events:none}
.row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding:2px}
.row::-webkit-scrollbar{display:none}
.lbl{font:600 10px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-right:4px;flex:none}
.dock button{flex:none;font:500 13px var(--body);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dock button:hover{border-color:var(--accent)}
.dock button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dock button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.dock button.cap{border-color:var(--accent);color:var(--accent)}
.sep{width:1px;height:22px;background:var(--line);flex:none;margin:0 4px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--night);font:600 13px var(--mono);letter-spacing:.2em;color:var(--accent);text-transform:uppercase;transition:opacity .5s}
#loading.done{opacity:0;pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(3,8,16,.78);display:grid;place-items:center;padding:16px}
.sheet{width:min(920px,100%);max-height:100%;overflow:auto;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:12px}
.sheet h2{margin:0;font:700 16px var(--display);letter-spacing:.14em;text-transform:uppercase}
.sheet p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:65ch}
.sheet img{width:100%;max-width:100%;aspect-ratio:2/1;border-radius:6px;background:#000;display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts a,.acts button{font:600 13px var(--body);border-radius:999px;padding:8px 14px;border:1px solid var(--line);color:var(--ink);background:transparent;text-decoration:none;cursor:pointer}
.acts .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dlmsg{align-self:center;font:500 13px var(--mono);color:var(--muted)}
@media (max-width:520px){.brand b{font-size:16px}.hint{display:none}}
@media (prefers-reduced-motion:reduce){.hint,#loading{transition:none}}

CITIES.forEach((C,i)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=C.chip; b.dataset.city=i; b.id='city-'+C.id; b.setAttribute('aria-pressed','false');
  b.onclick=()=>{ tourT = i===0 ? LOOP-TRANS : i*SEG-TRANS; if(tourT<0) tourT+=LOOP; }; dests.appendChild(b); });
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
const playBtn=document.getElementById('play'); playBtn.onclick=()=>{ playing=!playing; playBtn.textContent=playing?'Pause':'Play'; playBtn.setAttribute('aria-pressed',String(!playing)); };
const modal=document.getElementById('modal');
document.getElementById('cap').onclick=()=>{ const url=captureEquirect(4096); document.getElementById('capImg').src=url; capURL=url; document.getElementById('dlmsg').textContent=''; modal.hidden=false; };
let capURL='';
document.getElementById('dl').onclick=async()=>{ const msg=document.getElementById('dlmsg'); const name='archive-skyship-360-'+CITIES[shownIdx].id+'.jpg';
  const bin=atob(capURL.split(',')[1]), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); const blob=new Blob([u8],{type:'image/jpeg'}); let dls=null; try{ dls=window.claude?.use? await window.claude.use('downloads') : null; }catch(e){}
  if(dls){ try{ await dls.save({filename:name,data:blob}); msg.textContent='Saved.'; }catch(e){ msg.textContent= e?.code==='declined'?'Download cancelled.':'Right-click or long-press the image to save it.'; } return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); };
document.getElementById('close').onclick=()=>modal.hidden=true; modal.addEventListener('click',e=>{ if(e.target===modal) modal.hidden=true; });
addEventListener('keydown',e=>{ if(e.key==='Escape') modal.hidden=true; if(view!=='cabin') return; if(e.key==='ArrowLeft') yaw+=.08; if(e.key==='ArrowRight') yaw-=.08; if(e.key==='ArrowUp') pitch=Math.min(1.45,pitch+.06); if(e.key==='ArrowDown') pitch=Math.max(-1.45,pitch-.06); });
// drag to look in cabin + chase
const hint=document.getElementById('hint'); let drag=null; const pts=new Map(); let pinch0=0, fov0=72;
canvas.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,[e.clientX,e.clientY]); if(pts.size===2){ const [a,b]=[...pts.values()]; pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]); fov0=cabinCam.fov; } drag={x:e.clientX,y:e.clientY}; hint.classList.add('gone'); });
addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(view!=='cabin'||!drag) return; if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); cabinCam.fov=THREE.MathUtils.clamp(fov0*pinch0/Math.max(d,1),35,105); cabinCam.updateProjectionMatrix(); return; }
  const s=cabinCam.fov/72*.005; yaw+=(e.clientX-drag.x)*s; pitch=THREE.MathUtils.clamp(pitch+(e.clientY-drag.y)*s,-1.5,1.5); drag={x:e.clientX,y:e.clientY}; });
addEventListener('pointerup',e=>{ pts.delete(e.pointerId); if(!pts.size) drag=null; }); addEventListener('pointercancel',e=>{ pts.delete(e.pointerId); if(!pts.size) drag=null; });
canvas.addEventListener('wheel',e=>{ if(view!=='cabin') return; e.preventDefault(); cabinCam.fov=THREE.MathUtils.clamp(cabinCam.fov+e.deltaY*.03,35,105); cabinCam.updateProjectionMatrix(); },{passive:false});
function resize(){ if(RENDER) return; renderer.setSize(innerWidth,innerHeight,false); for(const c of [cabinCam,chaseCam,extCam]){ c.aspect=innerWidth/innerHeight; c.updateProjectionMatrix(); } }
addEventListener('resize',resize);

/* ---------------- loop + render API ---------------- */
let last=performance.now(), frame=0;
function loop(now){ requestAnimationFrame(loop); if(RENDER) return; const dt=Math.min(.05,(now-last)/1000); last=now; if(playing&&modal.hidden) tourT+=dt;
  update(tourT,dt); if(frame++%2===0) updateTelescope(); if(view==='ext') controls.update(); renderer.render(scene,camActive); }
window.SKYSHIP={ LOOP, SEG, STAY, TRANS, CITIES:CITIES.map(c=>c.chip), ready:false,
  warm(t){ for(let i=0;i<90;i++) update(t-3+i/30,1/30); },
  frame360(t,W=3840,dt=1/30){ update(t,dt); updateTelescope(); return captureEquirect(W); },
  frameFlat(t,v='cabin',dt=1/30,y=0,p=-.12){ setView(v); yaw=y; pitch=p; update(t,dt); updateTelescope(); if(v==='ext') controls.update(); renderer.render(scene,camActive); return canvas.toDataURL('image/jpeg',.9); },
  setView };
(async()=>{ try{ await Promise.race([Promise.all([document.fonts.load(`700 40px Montserrat`),document.fonts.load(`600 20px "IBM Plex Mono"`),document.fonts.load(`500 20px "IBM Plex Sans"`)]),new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  floorMat.map=floorTex(); floorMat.needsUpdate=true; setTimeout(buildEarth,RENDER?0:1200); update(0,1/60); updateTelescope();
  document.getElementById('loading').classList.add('done'); window.SKYSHIP.ready=true; requestAnimationFrame(loop); })();
</script>

</body></html>
