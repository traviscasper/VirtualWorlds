  const qz=h.question&&MODE==='learn'? `<div class="q"><b>${esc(h.question.q)}</b>${h.question.options.map((o,k)=>`<button type="button" data-k="${k}">${esc(o)}</button>`).join('')}<div class="why" hidden>${esc(h.question.why||'')}</div></div>`:'';
  cardEl.style.setProperty('--c',CATCOL[h.category]||'#7fe3ff');
  cardEl.innerHTML=`<button type="button" class="x" aria-label="Close">×</button><div class="kick">${esc(h.kicker||h.category||'')}</div><h3>${esc(h.title)}</h3><p>${esc(h.text)}</p>${facts?`<ul>${facts}</ul>`:''}${qz}`;
  cardEl.hidden=false; cardEl.querySelector('.x').onclick=closeCard;
  cardEl.querySelectorAll('.q button').forEach(b=>b.onclick=()=>{ const ok=+b.dataset.k===h.question.answer; b.classList.add(ok?'right':'wrong'); if(ok){ cardEl.querySelector('.why').hidden=false; seen.add(h.id+':quiz'); saveSeen(); drawLesson(); } });
  drawLesson(); }
function closeCard(){ focus=null; cardEl.hidden=true; }
function drawLesson(){ if(MODE!=='learn'){ lessonEl.hidden=true; return; } const L=J.lesson||{}; const wi=update.wi??0; const m=META[wi];
  const objs=(L.objectives||[]).map(o=>`<li class="${(o.hotspots||[]).every(id=>seen.has(id))?'done':''}">${esc(o.text)}</li>`).join('');
  const n=HOTSPOTS.filter(h=>seen.has(h.id)).length;
  lessonEl.innerHTML=`<div class="kick">Learn · ${esc(L.course||'Future Life Experiences')}</div><h2>${esc(L.title||J.title)}</h2>${L.intro?`<p class="hidesm" style="margin:0;font-size:13px;color:#cfe3f2;line-height:1.5">${esc(L.intro)}</p>`:''}<ol>${objs}</ol>
    <div class="now"><b>${esc(m.name)}</b><br>${esc((m.learningObjectives||[])[0]||'')}</div><div class="prog">${n} OF ${HOTSPOTS.length} INVESTIGATED · TAP A GLOWING MARKER</div>`;
  lessonEl.hidden=false; }
onWorldChange=wi=>{ const d=META[wi].disclaimer; noteEl.textContent=d||''; noteEl.hidden=!d||RENDER; drawLesson(); };
function setMode(m){ MODE=m; document.body.classList.remove('m-cinematic','m-explore','m-learn'); document.body.classList.add('m-'+m); document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));
  stopsRow.hidden=m==='cinematic'||!STOPS.length; closeCard(); if(m==='cinematic'){ target=null; liveT=tourT; } else if(STOPS.length){ let i=STOPS.findIndex(p=>p.t>=tourT-1); flyToStop(i<0?0:i); }
  markEls.forEach(b=>b.hidden=true); drawLesson(); try{ const u=new URL(location.href); u.searchParams.set('mode',m); history.replaceState(null,'',u); }catch(e){} }
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
const jsel=document.getElementById('jsel');
getJSON('../journeys/index.json').then(ix=>{ for(const j of ix.journeys){ const o=document.createElement('option'); o.value=j.id; o.textContent=j.title; if(j.id===JID) o.selected=true; jsel.appendChild(o); } }).catch(()=>{ jsel.hidden=true; });
jsel.onchange=()=>{ location.href=`journey.html?journey=${encodeURIComponent(jsel.value)}&mode=${MODE}`; };
const _pv=new V3();
function updateMarks(){ const on=MODE!=='cinematic'&&!renderer.xr.isPresenting; const wi=update.wi??0; const cam=camActive; cam.updateMatrixWorld(); cam.matrixWorldInverse.copy(cam.matrixWorld).invert();
  const cw=innerWidth, ch=innerHeight;
  HOTSPOTS.forEach((h,i)=>{ const el=markEls[i]; if(!on||h.world!==wi){ el.hidden=true; return; } const p=hotspotPos(h,_pv); if(!p){ el.hidden=true; return; }
    const d=p.distanceTo(ship.position); p.project(cam); const vis=p.z<1&&Math.abs(p.x)<1.05&&Math.abs(p.y)<1.05&&d<(h.range||2600);
    el.hidden=!vis; if(vis){ el.style.transform=`translate(${((p.x+1)/2*cw).toFixed(1)}px,${((1-p.y)/2*ch).toFixed(1)}px) translate(-50%,-50%)`; } }); }
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
const playBtn=document.getElementById('play');
function syncPlay(){ playBtn.textContent=playing?'Pause':'Play'; playBtn.setAttribute('aria-pressed',String(!playing)); }
playBtn.onclick=()=>{ if(MODE!=='cinematic'&&target!=null&&tourT>=target-.05){ flyToStop(stopIdx+1>=STOPS.length?0:stopIdx+1); return; } playing=!playing; syncPlay(); if(soundOn&&MODE==='cinematic'){ if(playing) startAudioAt(tourT); else stopAudio(); } };
const sndBtn=document.getElementById('snd'); sndBtn.onclick=async()=>{ if(soundOn){ soundOn=false; stopAudio(); sndBtn.textContent='Sound on'; sndBtn.setAttribute('aria-pressed','false'); return; }
  actx ||= new (window.AudioContext||window.webkitAudioContext)(); await actx.resume(); sndBtn.textContent='Composing…'; sndBtn.disabled=true;
  try{ await getSoundtrack(); soundOn=true; sndBtn.textContent='Sound off'; sndBtn.setAttribute('aria-pressed','true'); if(playing) startAudioAt(tourT); }catch(e){ sndBtn.textContent='Sound unavailable'; } sndBtn.disabled=false; };
const scrub=document.getElementById('scrub'), clock=document.getElementById('clock'); let scrubbing=false;
scrub.max=String(DURATION); scrub.addEventListener('input',()=>{ scrubbing=true; tourT=+scrub.value; liveT=tourT; target=null; }); scrub.addEventListener('change',()=>{ scrubbing=false; seek(+scrub.value); });
const modal=document.getElementById('modal');
let capURL='';
document.getElementById('cap').onclick=()=>{ const url=captureEquirect(4096); document.getElementById('capImg').src=url; capURL=url; document.getElementById('dlmsg').textContent=''; modal.hidden=false; };
document.getElementById('dl').onclick=async()=>{ const msg=document.getElementById('dlmsg'); const name=`archive-${JID}-360-`+WORKS[update.wi??0].id+'.jpg';
  const bin=atob(capURL.split(',')[1]), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); const blob=new Blob([u8],{type:'image/jpeg'}); let dls=null; try{ dls=window.claude?.use? await window.claude.use('downloads') : null; }catch(e){}
  if(dls){ try{ await dls.save({filename:name,data:blob}); msg.textContent='Saved.'; }catch(e){ msg.textContent= e?.code==='declined'?'Download cancelled.':'Right-click or long-press the image to save it.'; } return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); };
document.getElementById('close').onclick=()=>modal.hidden=true; modal.addEventListener('click',e=>{ if(e.target===modal) modal.hidden=true; });
addEventListener('keydown',e=>{ if(e.key==='Escape'){ modal.hidden=true; closeCard(); } if(e.key===' '&&e.target===document.body){ e.preventDefault(); playBtn.click(); } if(view!=='cabin') return; if(e.key==='ArrowLeft') yaw+=.08; if(e.key==='ArrowRight') yaw-=.08; if(e.key==='ArrowUp') pitch=Math.min(1.45,pitch+.06); if(e.key==='ArrowDown') pitch=Math.max(-1.45,pitch-.06); });
const hint=document.getElementById('hint'); let drag=null; const pts=new Map(); let pinch0=0, fov0=72;
canvas.addEventListener('pointerdown',e=>{ pts.set(e.pointerId,[e.clientX,e.clientY]); if(pts.size===2){ const [a,b]=[...pts.values()]; pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]); fov0=cabinCam.fov; } drag={x:e.clientX,y:e.clientY}; hint.classList.add('gone'); });
addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(view!=='cabin'||!drag) return; if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]); cabinCam.fov=clamp(fov0*pinch0/Math.max(d,1),35,105); cabinCam.updateProjectionMatrix(); return; }
  const s=cabinCam.fov/72*.005; yaw+=(e.clientX-drag.x)*s; pitch=clamp(pitch+(e.clientY-drag.y)*s,-1.5,1.5); drag={x:e.clientX,y:e.clientY}; });
addEventListener('pointerup',e=>{ pts.delete(e.pointerId); if(!pts.size) drag=null; }); addEventListener('pointercancel',e=>{ pts.delete(e.pointerId); if(!pts.size) drag=null; });
canvas.addEventListener('wheel',e=>{ if(view!=='cabin') return; e.preventDefault(); cabinCam.fov=clamp(cabinCam.fov+e.deltaY*.03,35,105); cabinCam.updateProjectionMatrix(); },{passive:false});
function resize(){ if(RENDER) return; renderer.setSize(innerWidth,innerHeight,false); for(const c of [cabinCam,chaseCam,extCam]){ c.aspect=innerWidth/innerHeight; c.updateProjectionMatrix(); } }
addEventListener('resize',resize);
// WebXR (Meta Quest browser etc.): your head is the camera, seated in the same cabin spot
const vrBtn=document.getElementById('vr'); let xrSession=null;
if(!RENDER && navigator.xr?.isSessionSupported){ navigator.xr.isSessionSupported('immersive-vr').then(ok=>{ if(!ok) return; vrBtn.hidden=false;
  vrBtn.onclick=async()=>{ if(xrSession){ xrSession.end(); return; } try{ xrSession=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']}); await renderer.xr.setSession(xrSession); vrBtn.textContent='Exit VR'; setView('cabin');
    xrSession.addEventListener('end',()=>{ xrSession=null; vrBtn.textContent='Enter VR'; }); }catch(e){ vrBtn.textContent='VR unavailable'; } }; }).catch(()=>{}); }

/* ---------------- loop + render API ---------------- */
let last=performance.now(), frame=0;
function loop(now){ if(RENDER) return; now=now||performance.now(); const dt=Math.min(.05,(now-last)/1000); last=now;
  if(playing&&modal.hidden&&!scrubbing){
    if(MODE==='cinematic'){ const at=soundOn?audioTime():null; if(at!=null){ tourT=at; if(tourT>=DURATION){ tourT=0; startAudioAt(0); } } else { tourT+=dt; if(tourT>=DURATION) tourT=0; } liveT=tourT; }
    else { liveT+=dt; if(target!=null){ const gap=target-tourT; if(gap>0){ tourT=Math.min(target,tourT+dt*(gap>8?2.5:1)); } } else { tourT=Math.min(DURATION-.01,tourT+dt); } }
  } else if(MODE!=='cinematic') liveT+=dt;
  const hoverWant=MODE!=='cinematic'&&(target!=null&&tourT>=target-.02||!playing||focus)?1:0; hoverAmt+=(hoverWant-hoverAmt)*(1-Math.exp(-dt*1.5));
  update(tourT,dt,MODE==='cinematic'?tourT:liveT,hoverAmt); if(frame++%2===0) updateTelescope(); if(view==='ext') controls.update(); updateMarks();
  if(frame%6===0){ if(!scrubbing) scrub.value=tourT.toFixed(1); clock.textContent=`${mmss(tourT)} / ${mmss(DURATION)}`;
    if(MODE!=='cinematic'&&target!=null&&tourT>=target-.05) { playBtn.textContent=stopIdx<STOPS.length-1?'Continue →':'Start over'; } else syncPlay(); }
  renderer.render(scene, renderer.xr.isPresenting? xrCam : camActive); }
let wavCache=null;
function clearance(step=.25){ // smallest distance from the ship's path to any declared collider box (metres), per world
  const out=[]; WORKS.forEach((w,i)=>{ const C=worlds[i].colliders; if(!C) return; let best={d:1e9}; const p=new V3();
    for(let t=w.t0;t<=w.t1;t+=step){ worlds[i].path.pos(t+w.off,p); for(const b of C){ const dx=Math.max(b[0]-p.x,0,p.x-b[3]), dy=Math.max(b[1]-p.y,0,p.y-b[4]), dz=Math.max(b[2]-p.z,0,p.z-b[5]); const d=Math.hypot(dx,dy,dz); if(d<best.d) best={d:+d.toFixed(1),t:+t.toFixed(2),box:b.slice(6).join(' ')}; } }
    out.push({world:w.id,...best}); }); return out; }
window.SKYSHIP={ DURATION, JOURNEY:JID, WORKS:WORKS.map(w=>w.chip), SHOTS:J.shots||[], ready:false,
  warm(t){ for(let i=0;i<90;i++) update(Math.max(0,t-3+i/30),1/30); },
  frame360(t,W=3840,dt=1/30){ update(t,dt); updateTelescope(); return captureEquirect(W); },
  aim(t,name){ update(t,1/30); ship.updateMatrixWorld(true); const w=anchorPos(name,update.wi,new V3()); if(!w) return null; const d=ship.worldToLocal(w).sub(cabinCam.position);
    return [Math.atan2(-d.x,-d.z), Math.atan2(d.y,Math.hypot(d.x,d.z))]; },
  frameFlat(t,v='cabin',dt=1/30,y=0,p=-.12){ setView(v); yaw=y; pitch=p; update(t,dt); updateTelescope(); if(v==='ext') controls.update(); renderer.render(scene,camActive); return canvas.toDataURL('image/jpeg',.9); },
  /** soundtrack for the video: prepare a WAV of [t0, t0+dur] and hand it over in base64 chunks */
  async soundtrackPrepare(t0=0,dur=DURATION,recompose=false){ const b=await (recompose? (async()=>{ soundBuf=null; composing=null; const keep=J.audio; J.audio={...(keep||{}),file:null}; try{ return await getSoundtrack(true); } finally{ J.audio=keep; } })() : getSoundtrack(!J.audio?.file)); const bytes=encodeWav(b,Math.max(0,t0),Math.min(DURATION,t0+dur)); wavCache=bytes; return Math.ceil(bytes.length/(3<<20)); },
  soundtrackChunk(i){ const n=3<<20; const part=wavCache.subarray(i*n,(i+1)*n); let s=''; for(let k=0;k<part.length;k+=32768) s+=String.fromCharCode.apply(null,part.subarray(k,k+32768)); return btoa(s); },
  hotspots(){ return HOTSPOTS.map(h=>({id:h.id,title:h.title,world:WORKS[h.world].id,ok:!!hotspotPos(h)})); }, openHotspot, flyToStop, clearance, setMode, setView,
  /** test controls (headless machines render a frame in seconds): stop the loop, jump, draw single frames */
  freeze(){ renderer.setAnimationLoop(null); }, resume(){ last=performance.now(); renderer.setAnimationLoop(loop); },
  goto(t){ tourT=liveT=clamp(t,0,DURATION-.01); target=MODE==='cinematic'?null:tourT; hoverAmt=MODE==='cinematic'?0:1; },
  step(n=1,dt=1/30){ for(let i=0;i<n;i++){ last=performance.now()-dt*1000; loop(performance.now()); } }, state(){ return {t:tourT,lt:liveT,target,mode:MODE,stop:stopIdx,world:update.wi}; } };
(async()=>{ try{ await Promise.race([Promise.all([document.fonts.load(`700 40px Montserrat`),document.fonts.load(`600 20px "IBM Plex Mono"`),document.fonts.load(`500 20px "IBM Plex Sans"`),document.fonts.load(`700 40px Cinzel`)]),new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  for(let i=0;i<META.length;i++){ const m=META[i]; say(`Building ${m.name}…`); await nextFrame();
    const mod=await import('../'+m.engine.module); const w=mod[m.engine.build](ctx); w.group.visible=false; scene.add(w.group); worlds.push(w); }
  if(WORKS.some(w=>w.earth)){ say('Building Earth…'); await nextFrame(); buildEarth(); }
  floorMat.map=floorTex(); floorMat.needsUpdate=true; redrawFinal(); update(0,1/60); updateTelescope();
  const bad=HOTSPOTS.filter(h=>!hotspotPos(h)); if(bad.length) console.warn('Hotspots without anchors:',bad.map(h=>h.id).join(', '));
  // compile every world once so the first flight through each does not stutter
  if(!RENDER){ say('Warming up…'); await nextFrame(); for(const w of worlds) w.group.visible=true; earthGroup.visible=true; renderer.compile(scene,cabinCam); curWorld=-1; lastChip=-1; update(0,1/60); }
  loadingEl.classList.add('done'); window.SKYSHIP.ready=true;
  if(!RENDER){ document.getElementById('clock').textContent=`0:00 / ${mmss(DURATION)}`; setMode(MODE); renderer.setAnimationLoop(loop); } })();
</script>
